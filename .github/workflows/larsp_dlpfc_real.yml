name: LaRSP real DLPFC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/**'
      - '.github/workflows/larsp_dlpfc_real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Real DLPFC calibrated diagnostic seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [11]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore shared DLPFC cache
        uses: actions/cache/restore@v4
        with:
          path: larsp_ci/data
          key: larsp-dlpfc-zenodo-v1-${{ runner.os }}
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn matplotlib anndata requests h5py
      - name: Restore and calibrate LaRSP experiment
        run: |
          git show bd4bb986cebeeb532e2f4eb64b2400b6fdefc4ad:larsp_ci/experiment.py.gz.b64 \
            | base64 --decode | gzip --decompress > larsp_ci/experiment.py
          python larsp_ci/runtime_patch_v2.py
          python -m py_compile larsp_ci/experiment.py
      - name: Run calibrated diagnostic
        shell: bash
        run: |
          mkdir -p larsp_ci/results/seed_${{ matrix.seed }}
          set -o pipefail
          python -u larsp_ci/experiment.py \
            --seed ${{ matrix.seed }} \
            --output-dir larsp_ci/results/seed_${{ matrix.seed }} \
            --data-dir larsp_ci/data \
            --n-hvg 1000 \
            --pca-dim 48 \
            --embedding-dim 48 \
            --cov-dim 20 \
            --batch-size 512 \
            --byol-epochs 2 \
            --finetune-epochs 2 \
            --cpu 2>&1 | tee larsp_ci/results/seed_${{ matrix.seed }}/run.log
      - name: Upload diagnostic results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larsp-dlpfc-calibrated-diagnostic-seed-${{ matrix.seed }}
          path: larsp_ci/results/seed_${{ matrix.seed }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
