name: LaRSP real DLPFC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/**'
      - '.github/workflows/larsp_dlpfc_real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runner:
    name: Extract verified LaRSP runner source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact successful source
        run: |
          mkdir -p larsp_ci/source_snapshot
          git show bd4bb986cebeeb532e2f4eb64b2400b6fdefc4ad:larsp_ci/experiment.py.gz.b64 \
            | base64 --decode | gzip --decompress > larsp_ci/source_snapshot/experiment.py
          grep -n '^def ' larsp_ci/source_snapshot/experiment.py > larsp_ci/source_snapshot/functions.txt
          sha256sum larsp_ci/source_snapshot/experiment.py > larsp_ci/source_snapshot/sha256.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: larsp-successful-runner-source
          path: larsp_ci/source_snapshot
          if-no-files-found: error
          retention-days: 14
