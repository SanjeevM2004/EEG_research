name: LaRSP real DLPFC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/**'
      - '.github/workflows/larsp_dlpfc_real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Real DLPFC diagnostic seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [11]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore shared DLPFC cache
        uses: actions/cache/restore@v4
        with:
          path: larsp_ci/data
          key: larsp-dlpfc-zenodo-v1-${{ runner.os }}

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn matplotlib anndata requests h5py

      - name: Restore and patch experiment source
        shell: bash
        run: |
          git show bd4bb986cebeeb532e2f4eb64b2400b6fdefc4ad:larsp_ci/experiment.py.gz.b64 \
            | base64 --decode | gzip --decompress > larsp_ci/experiment.py
          python - <<'PY'
          from pathlib import Path
          p = Path('larsp_ci/experiment.py')
          s = p.read_text()
          old = """def read_truth(path: Path) -> pd.Series:
              frame = pd.read_csv(path, sep='\\t', header=None, index_col=0)
              if frame.shape[1] < 1:
                  raise ValueError(f'Unusable truth file {path}')
              return frame.iloc[:, -1]
          """
          new = """def read_truth(path: Path) -> pd.Series:
              lines = [line.strip() for line in path.read_text(encoding='utf-8-sig').splitlines() if line.strip()]
              if not lines:
                  raise ValueError(f'Empty truth file {path}')
              rows = []
              for line in lines:
                  if '\\t' in line:
                      left, right = line.split('\\t', 1)
                      rows.append((left.strip(), right.strip()))
                  elif ',' in line:
                      left, right = line.split(',', 1)
                      rows.append((left.strip().strip('\\\"'), right.strip().strip('\\\"')))
                  else:
                      parts = line.split(maxsplit=1)
                      if len(parts) == 2 and ('-' in parts[0] or len(parts[0]) >= 12):
                          rows.append((parts[0].strip(), parts[1].strip()))
                      else:
                          rows.append((None, line.strip().strip('\\\"')))
              indexed = [row for row in rows if row[0] is not None]
              if len(indexed) >= max(1, int(0.9 * len(rows))):
                  index = [row[0] for row in rows]
                  values = [row[1] for row in rows]
                  if index and str(index[0]).lower() in {'barcode', 'spot', 'index', 'id'}:
                      index, values = index[1:], values[1:]
                  return pd.Series(values, index=pd.Index(index, dtype=str), dtype=object)
              values = [row[1] for row in rows]
              if values and str(values[0]).strip().lower() in {'label', 'layer', 'ground truth', 'ground_truth'}:
                  values = values[1:]
              return pd.Series(values, dtype=object)
          """
          old2 = """        else:
                      truth = read_truth(data_dir / f'{sid}_truth.txt')
                      truth.index = truth.index.astype(str)
                      raw = truth.reindex(barcodes).to_numpy()
          """
          new2 = """        else:
                      truth = read_truth(data_dir / f'{sid}_truth.txt')
                      if isinstance(truth.index, pd.RangeIndex):
                          if len(truth) != len(barcodes):
                              raise ValueError(f'{sid}: positional truth has {len(truth)} rows for {len(barcodes)} spots')
                          raw = truth.to_numpy()
                      else:
                          truth.index = truth.index.astype(str)
                          aligned = truth.reindex(barcodes)
                          matched = int(aligned.notna().sum())
                          if matched < int(0.9 * len(barcodes)):
                              if len(truth) == len(barcodes):
                                  print(f'[truth] {sid}: only {matched}/{len(barcodes)} barcode matches; using row order')
                                  raw = truth.to_numpy()
                              else:
                                  raise ValueError(f'{sid}: only {matched}/{len(barcodes)} truth barcodes matched')
                          else:
                              raw = aligned.to_numpy()
          """
          if old not in s or old2 not in s:
              raise RuntimeError('Expected source blocks were not found')
          p.write_text(s.replace(old, new).replace(old2, new2))
          PY
          python -m py_compile larsp_ci/experiment.py
          sha256sum larsp_ci/experiment.py

      - name: Run diagnostic end-to-end fold
        shell: bash
        run: |
          mkdir -p larsp_ci/results/seed_${{ matrix.seed }}
          set -o pipefail
          python -u larsp_ci/experiment.py \
            --seed ${{ matrix.seed }} \
            --output-dir larsp_ci/results/seed_${{ matrix.seed }} \
            --data-dir larsp_ci/data \
            --n-hvg 1000 \
            --pca-dim 48 \
            --embedding-dim 48 \
            --cov-dim 20 \
            --batch-size 512 \
            --byol-epochs 2 \
            --finetune-epochs 2 \
            --cpu 2>&1 | tee larsp_ci/results/seed_${{ matrix.seed }}/run.log

      - name: Save downloaded DLPFC cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: larsp_ci/data
          key: larsp-dlpfc-zenodo-v1-${{ runner.os }}

      - name: Upload diagnostic results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larsp-dlpfc-diagnostic-seed-${{ matrix.seed }}
          path: larsp_ci/results/seed_${{ matrix.seed }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
