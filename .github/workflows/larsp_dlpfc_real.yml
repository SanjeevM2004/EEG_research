name: LaRSP real DLPFC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/**'
      - '.github/workflows/larsp_dlpfc_real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schema:
    name: Inspect cached DLPFC annotations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore shared DLPFC cache
        uses: actions/cache/restore@v4
        with:
          path: larsp_ci/data
          key: larsp-dlpfc-zenodo-v1-${{ runner.os }}
      - name: Install readers
        run: pip install pandas anndata h5py scipy
      - name: Inspect annotation schemas
        run: |
          mkdir -p larsp_ci/schema
          cp larsp_ci/data/*_truth.txt larsp_ci/schema/
          python - <<'PY' > larsp_ci/schema/schema_report.txt
          from pathlib import Path
          import pandas as pd
          import anndata as ad
          for path in sorted(Path('larsp_ci/data').glob('*_truth.txt')):
              sid = path.name.split('_')[0]
              print('\n' + '='*20, sid, '='*20)
              raw = path.read_text(encoding='utf-8-sig').splitlines()
              print('line_count', len(raw), 'first_lines', repr(raw[:5]))
              for name, kwargs in [
                  ('tab_no_header', dict(sep='\\t', header=None)),
                  ('comma_no_header', dict(sep=',', header=None)),
                  ('auto_no_header', dict(sep=None, engine='python', header=None)),
                  ('tab_header', dict(sep='\\t')),
              ]:
                  try:
                      frame = pd.read_csv(path, **kwargs)
                      print(name, 'shape', frame.shape, 'columns', list(map(str, frame.columns[:10])))
                      print(frame.head(3).to_string(index=False))
                  except Exception as exc:
                      print(name, 'ERROR', repr(exc))
              h5 = Path('larsp_ci/data') / f'{sid}_filtered_feature_bc_matrix.h5ad'
              a = ad.read_h5ad(h5, backed='r')
              print('h5ad_shape', a.shape)
              print('obs_columns', list(map(str, a.obs.columns)))
              print(a.obs.head(3).to_string())
              a.file.close()
          PY
      - name: Upload schemas
        uses: actions/upload-artifact@v4
        with:
          name: larsp-dlpfc-schema
          path: larsp_ci/schema
          if-no-files-found: error
          retention-days: 14
