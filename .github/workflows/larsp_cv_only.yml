name: LaRSP CV-only DLPFC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/cv_only_runner.py'
      - 'larsp_ci/dataset_checkpoint_runner.py'
      - '.github/workflows/larsp_cv_only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dataset:
    name: Build validated image-only DLPFC checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore verified raw-source cache
        uses: actions/cache/restore@v4
        with:
          path: larsp_ci/data
          key: larsp-cv-source-v2-${{ runner.os }}
          restore-keys: |
            larsp-cv-only-dlpfc-v1-${{ runner.os }}
            larsp-dlpfc-zenodo-v1-${{ runner.os }}

      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn scikit-image matplotlib anndata requests h5py pillow

      - name: Audit image-only source
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile larsp_ci/cv_only_runner.py larsp_ci/dataset_checkpoint_runner.py
          python - <<'PY'
          import ast
          from pathlib import Path
          violations = []
          for name in ['larsp_ci/cv_only_runner.py', 'larsp_ci/dataset_checkpoint_runner.py']:
              tree = ast.parse(Path(name).read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Attribute) and node.attr in {'X', 'layers', 'var', 'var_names'}:
                      violations.append((name, node.lineno, f'attribute .{node.attr}'))
          if violations:
              raise SystemExit(f'Forbidden expression-path AST nodes: {violations}')
          print('AST audit passed: no expression matrix or gene-level fields are accessed.')
          PY

      - name: Build and reload validated dataset checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf larsp_ci/checkpoints
          python -u larsp_ci/dataset_checkpoint_runner.py build \
            --data-dir larsp_ci/data \
            --checkpoint larsp_ci/checkpoints/dlpfc_cv_v2.pt \
            --patch-size 48 2>&1 | tee dataset_build.log
          test -s larsp_ci/checkpoints/dlpfc_cv_v2.pt
          test -s larsp_ci/checkpoints/dlpfc_cv_v2.manifest.json

      - name: Upload validated checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: dlpfc-cv-dataset-v2
          path: |
            larsp_ci/checkpoints/dlpfc_cv_v2.pt
            larsp_ci/checkpoints/dlpfc_cv_v2.manifest.json
            dataset_build.log
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  validate:
    name: Image-only LODO seed ${{ matrix.seed }}
    needs: build-dataset
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 42, 73]

    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
      TORCH_HOME: ${{ github.workspace }}/larsp_ci/torch_cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Download validated dataset checkpoint
        uses: actions/download-artifact@v4
        with:
          name: dlpfc-cv-dataset-v2
          path: larsp_ci/checkpoints_download

      - name: Install image-only scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn scikit-image matplotlib anndata requests h5py pillow

      - name: Verify checkpoint before training
        shell: bash
        run: |
          set -euo pipefail
          test -s larsp_ci/checkpoints_download/larsp_ci/checkpoints/dlpfc_cv_v2.pt
          test -s larsp_ci/checkpoints_download/larsp_ci/checkpoints/dlpfc_cv_v2.manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('larsp_ci/checkpoints_download/larsp_ci/checkpoints/dlpfc_cv_v2.manifest.json')
          m = json.loads(p.read_text())
          assert m['sections'] == 12, m
          assert m['spots'] > 1000, m
          assert len(m['donors']) == 3, m
          print(json.dumps(m, indent=2))
          PY
          sha256sum larsp_ci/cv_only_runner.py larsp_ci/dataset_checkpoint_runner.py | tee cv_only_source_sha256.txt

      - name: Run strict image-only leave-one-donor-out experiment
        shell: bash
        run: |
          mkdir -p larsp_ci/results_cv/seed_${{ matrix.seed }}
          set -o pipefail
          python -u larsp_ci/dataset_checkpoint_runner.py train \
            --checkpoint larsp_ci/checkpoints_download/larsp_ci/checkpoints/dlpfc_cv_v2.pt \
            --seed ${{ matrix.seed }} \
            --output-dir larsp_ci/results_cv/seed_${{ matrix.seed }} \
            --data-dir larsp_ci/data \
            --patch-size 48 \
            --embedding-dim 64 \
            --cov-dim 24 \
            --batch-size 256 \
            --byol-epochs 12 \
            --finetune-epochs 8 \
            --majority-k 8 \
            --majority-steps 2 \
            --cpu 2>&1 | tee larsp_ci/results_cv/seed_${{ matrix.seed }}/run.log
          cp cv_only_source_sha256.txt larsp_ci/results_cv/seed_${{ matrix.seed }}/
          cp larsp_ci/checkpoints_download/larsp_ci/checkpoints/dlpfc_cv_v2.manifest.json larsp_ci/results_cv/seed_${{ matrix.seed }}/

      - name: Record environment
        if: always()
        run: |
          mkdir -p larsp_ci/results_cv/seed_${{ matrix.seed }}
          python -m pip freeze > larsp_ci/results_cv/seed_${{ matrix.seed }}/requirements_frozen.txt
          uname -a > larsp_ci/results_cv/seed_${{ matrix.seed }}/runner_system.txt

      - name: Upload measured CV-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larsp-cv-only-seed-${{ matrix.seed }}
          path: larsp_ci/results_cv/seed_${{ matrix.seed }}
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

