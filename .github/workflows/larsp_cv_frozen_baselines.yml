name: LaRSP frozen CV image baselines

on:
  pull_request:
    branches: [main]
    paths:
      - 'larsp_ci/frozen_cv_baselines.py'
      - 'larsp_ci/cv_only_runner.py'
      - 'larsp_ci/dataset_checkpoint_runner.py'
      - '.github/workflows/larsp_cv_frozen_baselines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dataset:
    name: Build validated image-only DLPFC checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore verified raw-source cache
        uses: actions/cache/restore@v4
        with:
          path: larsp_ci/data
          key: larsp-cv-source-v2-${{ runner.os }}
          restore-keys: |
            larsp-cv-only-dlpfc-v1-${{ runner.os }}
            larsp-dlpfc-zenodo-v1-${{ runner.os }}

      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn scikit-image matplotlib anndata requests h5py pillow

      - name: Audit expression-free source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile larsp_ci/frozen_cv_baselines.py larsp_ci/cv_only_runner.py larsp_ci/dataset_checkpoint_runner.py
          python - <<'PY'
          import ast
          from pathlib import Path
          violations = []
          for name in ['larsp_ci/frozen_cv_baselines.py', 'larsp_ci/dataset_checkpoint_runner.py']:
              tree = ast.parse(Path(name).read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Attribute) and node.attr in {'X', 'layers', 'var', 'var_names'}:
                      violations.append((name, node.lineno, f'attribute .{node.attr}'))
          if violations:
              raise SystemExit(f'Forbidden expression-path AST nodes: {violations}')
          print('AST audit passed: no expression matrix or gene-level fields are accessed.')
          PY

      - name: Build validated dataset checkpoint
        run: |
          rm -rf larsp_ci/checkpoints_baselines
          python -u larsp_ci/dataset_checkpoint_runner.py build \
            --data-dir larsp_ci/data \
            --checkpoint larsp_ci/checkpoints_baselines/dlpfc_cv_v2.pt \
            --patch-size 48 2>&1 | tee frozen_baseline_dataset_build.log

      - name: Upload validated checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: dlpfc-cv-dataset-frozen-baselines
          path: |
            larsp_ci/checkpoints_baselines/dlpfc_cv_v2.pt
            larsp_ci/checkpoints_baselines/dlpfc_cv_v2.manifest.json
            frozen_baseline_dataset_build.log
          compression-level: 1
          retention-days: 30

  evaluate-baselines:
    name: Frozen DINOv2 and dense segmentation LODO
    needs: build-dataset
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
      TORCH_HOME: ${{ github.workspace }}/larsp_ci/torch_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Download validated checkpoint
        uses: actions/download-artifact@v4
        with:
          name: dlpfc-cv-dataset-frozen-baselines
          path: larsp_ci/checkpoints_download

      - name: Install image-only stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn matplotlib pillow

      - name: Run frozen CV baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p larsp_ci/results_frozen_baselines
          python -u larsp_ci/frozen_cv_baselines.py \
            --checkpoint larsp_ci/checkpoints_download/larsp_ci/checkpoints_baselines/dlpfc_cv_v2.pt \
            --output-dir larsp_ci/results_frozen_baselines \
            --batch-size 64 \
            --seeds 11 42 73 \
            --cpu 2>&1 | tee larsp_ci/results_frozen_baselines/run.log

      - name: Record environment
        if: always()
        run: |
          python -m pip freeze > larsp_ci/results_frozen_baselines/requirements_frozen.txt
          uname -a > larsp_ci/results_frozen_baselines/runner_system.txt

      - name: Upload measured frozen baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larsp-cv-frozen-image-baselines
          path: larsp_ci/results_frozen_baselines
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
